<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Propria GmbH · Q1+Q2 2026</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:13px}
body{font-family:-apple-system,'Segoe UI',Arial,sans-serif;background:#f4f5f0;color:#1a1a1a}

/* topbar */
.tb{position:sticky;top:0;z-index:999;background:#1e2d5a;color:#fff;display:flex;align-items:center;gap:14px;padding:0 22px;height:50px}
.tb-logo{font-size:13px;font-weight:700;white-space:nowrap}
.bc{flex:1;font-size:12px;color:#8aa4d8;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.bc-a{color:#7ab8f5;cursor:pointer;text-decoration:underline}.bc-a:hover{color:#fff}
.bc-sep{color:#3a5090}
#bk{display:none;padding:5px 12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:5px;color:#fff;font-size:12px;cursor:pointer}
#bk:hover{background:rgba(255,255,255,.22)}

/* app */
#app{padding:24px}

/* home */
.h-intro{font-size:14px;color:#888;margin-bottom:18px}
.h-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:900px}
.htile{background:#fff;border-radius:10px;padding:20px;cursor:pointer;border:1px solid #e5e8f0;border-top:4px solid;transition:box-shadow .15s,transform .1s}
.htile:hover{box-shadow:0 4px 16px rgba(0,0,0,.10);transform:translateY(-2px)}
.ht-type{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#bbb;margin-bottom:6px}
.ht-name{font-size:15px;font-weight:800;margin-bottom:10px}
.ht-cnt{font-size:40px;font-weight:900;line-height:1;margin-bottom:6px}
.ht-sub{font-size:11px;color:#aaa}
.tc-r{border-top-color:#3b82f6}.tc-r .ht-cnt{color:#3b82f6}
.tc-p{border-top-color:#22c55e}.tc-p .ht-cnt{color:#22c55e}
.tc-o{border-top-color:#f97316}.tc-o .ht-cnt{color:#f97316}
.tc-i{border-top-color:#a855f7}.tc-i .ht-cnt{color:#a855f7}

/* section heading */
.sec-hdr{font-size:16px;font-weight:800;margin-bottom:16px}
.sec-cnt{font-size:11px;color:#aaa;font-weight:400;margin-left:8px}

/* table */
.tw{max-width:1080px;overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
thead tr{background:#f0f2fa}
th{padding:9px 14px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#777;border-bottom:1px solid #e6eaf5;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid #f2f4fb;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.cl{cursor:pointer}
tbody tr.cl:hover{background:#f5f8ff}
.tr{text-align:right}
.mn{font-family:'SF Mono','Fira Mono',monospace;font-size:12px}
.pos{color:#1a7a3c;font-weight:700}
.neg{color:#c0392b;font-weight:700}
.dim{color:#bbb}
.tft td{background:#f0f2fa;font-weight:700;border-top:2px solid #dce3f8}

/* document */
.dw{max-width:760px}
.dc{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.dh{padding:20px 26px;border-left:5px solid #ccc;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.dh.hr{border-left-color:#3b82f6}.dh.hp{border-left-color:#22c55e}
.dh.ho{border-left-color:#f97316}.dh.hi{border-left-color:#a855f7}
.de{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#bbb;margin-bottom:5px}
.dt{font-size:20px;font-weight:800}
.ds{font-size:12px;color:#888;margin-top:4px}
.da{font-size:26px;font-weight:900;padding-top:4px}
.db{padding:20px 26px}

/* fields */
.flds{display:grid;grid-template-columns:1fr 1fr;gap:12px 26px;margin-bottom:4px}
.fl .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:#ccc}
.fl .val{font-size:13px;font-weight:600;margin-top:2px}

/* related docs */
.rels{margin-top:20px;padding-top:16px;border-top:1px solid #f0f0f0}
.rels-ttl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#ccc;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;border:1px solid;font-size:12px;font-weight:600;cursor:pointer;margin:3px;transition:opacity .1s,transform .1s}
.chip:hover{opacity:.72;transform:translateY(-1px)}
.cr{background:#dbeafe;color:#1e40af;border-color:#93c5fd}
.cp{background:#dcfce7;color:#15803d;border-color:#86efac}
.co{background:#ffedd5;color:#c2410c;border-color:#fdba74}
.ci{background:#f3e8ff;color:#7e22ce;border-color:#d8b4fe}

/* inline table link */
.tl{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:4px;border:1px solid;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}

/* sub-table inside doc */
.sub-ttl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#bbb;margin:18px 0 8px}

/* badges */
.bdg{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px}
.bs{background:#dcfce7;color:#166534}.br{background:#fee2e2;color:#991b1b}
.bd{background:#fef9c3;color:#854d0e}.bv{background:#d1fae5;color:#065f46}
.bw{background:#fee2e2;color:#991b1b}.bx{background:#dbeafe;color:#1e40af}

@media print{
  .tb,#bk{display:none}
  #app{padding:0}
  .dc{box-shadow:none;border:1px solid #ddd;page-break-after:always}
}
</style>

  if (entity==='payouts')  return d.payoutId;
  if (entity==='orders')   return d.num;
  if (entity==='invoices') return d.invNum;
}

// ─── STATE ───────────────────────────────────────────────────────────────────

const S = { stack:[], filterMode:'all', filter:{from:0,to:99999999}, customFrom:'', customTo:'' };

function push(item) { S.stack.push(item); render(); updateNav(); }

function back() {
  S.stack.pop();
  if (!S.stack.length) S.stack.push({kind:'home'});
  render(); updateNav();
}

function jumpTo(i) { S.stack = S.stack.slice(0,i+1); render(); updateNav(); }

function navJournal(e) {
  push({kind:'journal', entity:e});
}

function navDoc(e, id) { push({kind:'doc', entity:e, id}); }

function goHome() { S.stack=[{kind:'home'}]; render(); updateNav(); }

function updateNav() {
  document.getElementById('bk').style.display = S.stack.length>1?'inline-block':'none';
  const bc = document.getElementById('bc');
  bc.innerHTML = S.stack.map((s,i) => {
    const last = i===S.stack.length-1;
    const lbl = s.kind==='home' ? 'Q1+Q2 2026'
              : s.kind==='journal' ? META[s.entity].name
              : docLabel(s.entity, s.id);
    return last ? '<span>'+lbl+'</span>'
                : '<span class="bc-a" onclick="jumpTo('+i+')">'+lbl+'</span>';
  }).join('<span class="bc-sep"> › </span>');
}

// ─── UTILITIES ───────────────────────────────────────────────────────────────

function M(n) {
  const a = '€'+Math.abs(n).toFixed(2).replace('.',',');
  return n>0?'<span class="pos">+'+a+'</span>':n<0?'<span class="neg">−'+a+'</span>':'<span>'+a+'</span>';
}

function chip(entity, id, label) {
  const m=META[entity];
  return '<span class="chip '+m.chip+'" onclick="navDoc(\''+entity+'\',\''+id+'\')">'+m.icon+' '+label+'</span>';
}

function tlink(entity, id, txt) {
  const m=META[entity];
  return '<span class="tl '+m.chip+'" onclick="event.stopPropagation();navDoc(\''+entity+'\',\''+id+'\')">'+m.icon+' '+txt+'</span>';
}

function badgeCls(t) {
  if(t==='Sale') return 'bs';
  if(t==='Refund') return 'br';
  if(t==='Dispute') return 'bd';
  if(t==='Spor vygran'||t==='Dispute Reversal') return 'bv';
  if(t==='Withdrawn') return 'bw';
  if(t==='Deposited') return 'bx';
  return 'bs';
}

// ─── FILTER ──────────────────────────────────────────────────────────────────

function dateInt(s) {
  if(!s || !s.includes('.')) return 0;
  const [d,m,y] = s.split('.');
  return parseInt(y+m+d,10);
}

function inFilter(entity, d) {
  const {from,to} = S.filter;
  if(from===0 && to===99999999) return true;
  const src = entity==='invoices' ? d.payDate : d.date;
  const dt = dateInt(src);
  return dt>=from && dt<=to;
}

function setFilter(mode, from, to) {
  S.filterMode = mode;
  if(mode==='all')    { S.filter={from:0,to:99999999}; }
  else if(mode==='q1') { S.filter={from:20260101,to:20260331}; }
  else if(mode==='q2') { S.filter={from:20260401,to:20260630}; }
  else if(mode==='custom') {
    const f = (from||'').replace(/-/g,''); const t = (to||'').replace(/-/g,'');
    S.filter={from:f?parseInt(f,10):0, to:t?parseInt(t,10):99999999};
    S.customFrom=from||''; S.customTo=to||'';
  }
  render();
}

function applyCustom() {
  const f=document.getElementById('fdf').value, t=document.getElementById('fdt').value;
  setFilter('custom', f||'', t||'');
}

function filterBar() {
  const m=S.filterMode||'all';
  const bs='padding:5px 12px;border-radius:5px;border:1px solid;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;';
  const act='background:#1e2d5a;color:#fff;border-color:#1e2d5a;';
  const inact='background:#fff;color:#555;border-color:#d0d5e0;';
  const btn=(mode,lbl)=>'<button onclick="setFilter(\''+mode+'\')" style="'+bs+(m===mode?act:inact)+'">'+lbl+'</button>';
  const cb=m==='custom'?act:inact;
  return '<div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px;padding:11px 16px;background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.07)">'
    +'<span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#bbb;margin-right:2px">Период:</span>'
    +btn('all','Весь период')
    +btn('q1','Q1 · янв–март')
    +btn('q2','Q2 · апр–июн')
    +'<span style="color:#ddd;margin:0 2px">│</span>'
    +'<span style="font-size:12px;color:#999">с</span>'
    +'<input type="date" id="fdf" value="'+(S.customFrom||'')+'" style="padding:4px 8px;border:1px solid #ddd;border-radius:4px;font-size:12px">'
    +'<span style="font-size:12px;color:#999">по</span>'
    +'<input type="date" id="fdt" value="'+(S.customTo||'')+'" style="padding:4px 8px;border:1px solid #ddd;border-radius:4px;font-size:12px">'
    +'<button onclick="applyCustom()" style="'+bs+cb+'">Применить</button>'
    +'</div>';
}

// ─── RENDER ──────────────────────────────────────────────────────────────────

function render() {
  const cur = S.stack[S.stack.length-1];
  const app = document.getElementById('app');
  if(cur.kind==='home')    { app.innerHTML=renderHome(); return; }
  if(cur.kind==='journal') { app.innerHTML=renderJournal(cur.entity); return; }
  if(cur.kind==='doc')     { app.innerHTML=renderDoc(cur.entity,cur.id); return; }
}

function renderHome() {
  return '<div class="h-intro">Выберите журнал</div><div class="h-grid">'
    +htile('revolut','Расчётный счёт',229,'Revolut EUR · Q1+Q2 2026','tc-r')
    +htile('payouts','Пейауты',3,'Shopify · все магазины','tc-p')
    +htile('orders','Ордера',9,'все магазины · все типы','tc-o')
    +htile('invoices','Инвойсы поставщиков',2,'Alibaba · Hangzhou Linen','tc-i')
    +'</div>';
}
function htile(e,name,cnt,sub,cls) {
  return '<div class="htile '+cls+'" onclick="navJournal(\''+e+'\')"><div class="ht-type">Журнал</div><div class="ht-name">'+name+'</div><div class="ht-cnt">'+cnt+'</div><div class="ht-sub">'+sub+'</div></div>';
}

function renderJournal(entity) {
  const m=META[entity];
  const allKeys=Object.keys(DB[entity]);
  const entries=Object.entries(DB[entity]).filter(([id,d])=>inFilter(entity,d));
  let tbl='';
  if(entity==='revolut')  tbl=jRevolut(entries);
  if(entity==='payouts')  tbl=jPayouts(entries);
  if(entity==='orders')   tbl=jOrders(entries);
  if(entity==='invoices') tbl=jInvoices(entries);
  const filtNote = entries.length<allKeys.length
    ? ' · <span style="color:#e07800">показано '+entries.length+' из '+allKeys.length+'</span>'
    : '';
  return '<div class="sec-hdr">'+m.name+'<span class="sec-cnt">'+allKeys.length+' записей'+filtNote+'</span></div>'
    +filterBar()
    +'<div class="tw">'+tbl+'</div>';
}

function jRevolut(entries) {
  if(!entries.length) return '<div style="padding:24px;color:#bbb;text-align:center">Нет записей за выбранный период</div>';
  const rows = entries.map(([id,d])=>{
    const lnk = d.docUrl
      ? '<a href="'+d.docUrl+'" target="_blank" class="tl cr" onclick="event.stopPropagation()" style="text-decoration:none">📄 '+d.docLabel+'</a>'
      : (d.refs.length ? tlink(d.refs[0].e, d.refs[0].id, META[d.refs[0].e].name+' '+docLabel(d.refs[0].e,d.refs[0].id))
      : '<span class="dim">—</span>');
    return '<tr class="cl" onclick="navDoc(\'revolut\',\''+id+'\')">'
      +'<td>'+d.date+'</td>'
      +'<td class="mn" style="max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+d.desc+'</td>'
      +'<td>'+d.party+'</td>'
      +'<td class="mn" style="font-size:11px;color:#888">'+d.type+'</td>'
      +'<td class="tr mn">'+M(d.amount)+'</td>'
      +'<td class="tr mn">'+M(d.balance)+'</td>'
      +'<td>'+lnk+'</td>'
      +'</tr>';
  }).join('');
  const inflow  = entries.reduce((a,[,d])=>a+(d.amount>0?d.amount:0),0);
  const outflow = entries.reduce((a,[,d])=>a+(d.amount<0?d.amount:0),0);
  const net     = inflow+outflow;
  const tf='<tfoot><tr class="tft"><td colspan="4">Итого за период · '+entries.length+' операций</td>'
    +'<td class="tr mn"><span style="font-size:10px;color:#aaa;display:block">приход '+M(inflow)+'</span>'
    +'<span style="font-size:10px;color:#aaa;display:block">расход '+M(outflow)+'</span>'
    +M(net)+'</td>'
    +'<td class="tr mn" style="font-size:11px;color:#aaa">баланс на конец: '+M(entries[entries.length-1][1].balance)+'</td>'
    +'<td></td></tr></tfoot>';
  return '<table><thead><tr><th>Дата</th><th>Описание / Reference</th><th>Контрагент</th><th>Тип</th><th class="tr">Сумма</th><th class="tr">Баланс</th><th>Документ</th></tr></thead><tbody>'+rows+'</tbody>'+tf+'</table>';
}

function jPayouts(entries) {
  if(!entries.length) return '<div style="padding:24px;color:#bbb;text-align:center">Нет записей за выбранный период</div>';
  const rows = entries.map(([id,d])=>{
    const txnInfo = d.txns.length+' транз. · '+d.txns.map(t=>'<span class="bdg '+badgeCls(t.type)+'">'+t.type+'</span>').join(' ');
    return '<tr class="cl" onclick="navDoc(\'payouts\',\''+id+'\')">'
      +'<td>'+d.date+'</td>'
      +'<td class="mn">'+d.payoutId+'</td>'
      +'<td>'+d.store+'</td>'
      +'<td><span class="bdg '+badgeCls(d.status)+'">'+d.status+'</span></td>'
      +'<td class="tr mn">'+M(d.amount)+'</td>'
      +'<td style="font-size:12px">'+txnInfo+'</td>'
      +'</tr>';
  }).join('');
  const total=entries.reduce((a,[,d])=>a+d.amount,0);
  const tf='<tfoot><tr class="tft"><td colspan="4">Итого за период · '+entries.length+' пейаутов</td>'
    +'<td class="tr mn">'+M(total)+'</td><td></td></tr></tfoot>';
  return '<table><thead><tr><th>Дата</th><th>Payout ID</th><th>Магазин</th><th>Статус</th><th class="tr">Сумма</th><th>Содержание</th></tr></thead><tbody>'+rows+'</tbody>'+tf+'</table>';
}

function jOrders(entries) {
  if(!entries.length) return '<div style="padding:24px;color:#bbb;text-align:center">Нет записей за выбранный период</div>';
  const rows = entries.map(([id,d])=>{
    return '<tr class="cl" onclick="navDoc(\'orders\',\''+id+'\')">'
      +'<td>'+d.date+'</td>'
      +'<td class="mn"><strong>'+d.num+'</strong></td>'
      +'<td>'+d.store+'</td>'
      +'<td><span class="bdg '+badgeCls(d.type)+'">'+d.type+'</span></td>'
      +'<td>'+(d.buyer||'<span class="dim">—</span>')+'</td>'
      +'<td class="tr mn">'+M(d.net)+'</td>'
      +'</tr>';
  }).join('');
  const sales   = entries.reduce((a,[,d])=>a+(d.type==='Sale'?d.net:0),0);
  const refunds = entries.reduce((a,[,d])=>a+(d.type!=='Sale'?d.net:0),0);
  const net     = entries.reduce((a,[,d])=>a+d.net,0);
  const tf='<tfoot><tr class="tft"><td colspan="5">Итого за период · '+entries.length+' ордеров'
    +' · <span style="font-size:10px;color:#aaa">продажи '+M(sales)+' / возвраты '+M(refunds)+'</span></td>'
    +'<td class="tr mn">'+M(net)+'</td></tr></tfoot>';
  return '<table><thead><tr><th>Дата</th><th>Ордер</th><th>Магазин</th><th>Тип</th><th>Покупатель</th><th class="tr">Нетто</th></tr></thead><tbody>'+rows+'</tbody>'+tf+'</table>';
}

function jInvoices(entries) {
  if(!entries.length) return '<div style="padding:24px;color:#bbb;text-align:center">Нет записей за выбранный период</div>';
  const rows = entries.map(([id,d])=>{
    return '<tr class="cl" onclick="navDoc(\'invoices\',\''+id+'\')">'
      +'<td>'+d.payDate+'</td>'
      +'<td class="mn"><strong>'+d.invNum+'</strong></td>'
      +'<td>'+d.supplier+'</td>'
      +'<td>'+d.store+'</td>'
      +'<td class="tr mn">'+M(d.amount)+'</td>'
      +'</tr>';
  }).join('');
  const total=entries.reduce((a,[,d])=>a+d.amount,0);
  const tf='<tfoot><tr class="tft"><td colspan="4">Итого за период · '+entries.length+' инвойсов</td>'
    +'<td class="tr mn">'+M(total)+'</td></tr></tfoot>';
  return '<table><thead><tr><th>Дата оплаты</th><th>Инвойс</th><th>Поставщик</th><th>Магазин</th><th class="tr">Сумма</th></tr></thead><tbody>'+rows+'</tbody>'+tf+'</table>';
}

// ─── DOCUMENT ────────────────────────────────────────────────────────────────

function renderDoc(entity, id) {
  const d=DB[entity][id], m=META[entity];
  const toJournal = '<button onclick="navJournal(\''+entity+'\')" style="display:inline-flex;align-items:center;gap:5px;padding:5px 12px;background:#f4f5f0;border:1px solid #d8dce8;border-radius:5px;font-size:12px;font-weight:600;color:#555;cursor:pointer;margin-bottom:14px">← '+m.name+'</button>';
  const title  = docLabel(entity,id);
  const sub    = entity==='revolut'  ? d.date+' · '+d.type
               : entity==='payouts'  ? d.date+' · '+d.store
               : entity==='orders'   ? d.date+' · '+d.store
               : d.payDate+' · '+d.store;
  const amount = entity==='orders' ? d.net : d.amount;
  const flds = Object.entries(d.fields).map(([k,v])=>'<div class="fl"><div class="lbl">'+k+'</div><div class="val">'+v+'</div></div>').join('');
  const extra = entity==='payouts' ? docPayoutTxns(d) : entity==='invoices' ? docInvoiceItems(d) : '';
  const driveBtn = (entity==='revolut' && d.docUrl)
    ? '<div class="rels"><div class="rels-ttl">Документ</div><a href="'+d.docUrl+'" target="_blank" class="chip cr" style="text-decoration:none">📄 '+d.docLabel+'</a></div>'
    : '';
  const rels = d.refs.length ? '<div class="rels"><div class="rels-ttl">Связанные документы</div>'+d.refs.map(r=>chip(r.e,r.id,r.label)).join('')+'</div>' : '';
  return '<div class="dw">'+toJournal+'<div class="dc">'
    +'<div class="dh '+m.hl+'"><div><div class="de">'+m.name+'</div><div class="dt">'+title+'</div><div class="ds">'+sub+'</div></div>'
    +'<div class="da">'+M(amount)+'</div></div>'
    +'<div class="db"><div class="flds">'+flds+'</div>'+extra+driveBtn+rels+'</div></div></div>';
}

function docPayoutTxns(d) {
  const sum = d.txns.reduce((a,t)=>a+t.net,0);
  const rows = d.txns.map(t=>'<tr class="cl" onclick="navDoc(\'orders\',\''+t.oid+'\')"><td class="mn"><strong>'+t.num+'</strong></td><td><span class="bdg '+badgeCls(t.type)+'">'+t.type+'</span></td><td class="tr mn">'+M(t.net)+' <span style="color:#bbb;font-size:11px">→</span></td></tr>').join('');
  return '<div class="sub-ttl">Транзакции в пейауте</div>'
    +'<table><thead><tr><th>Ордер</th><th>Тип</th><th class="tr">Нетто</th></tr></thead><tbody>'+rows+'</tbody>'
    +'<tfoot><tr class="tft"><td colspan="2">Итого</td><td class="tr mn">'+M(sum)+'</td></tr></tfoot></table>'
    +'<div style="font-size:11px;color:#bbb;margin-top:5px">Клик на строку → открыть ордер</div>';
}

function docInvoiceItems(d) {
  const rows = d.items.map(i=>'<tr><td>'+i.name+'</td><td class="mn dim" style="font-size:11px">'+i.art+'</td><td class="tr">'+i.qty+'</td><td class="tr mn">'+M(i.price)+'</td><td class="tr mn">'+M(i.qty*i.price)+'</td></tr>').join('');
  const total = d.items.reduce((a,i)=>a+i.qty*i.price,0);
  return '<div class="sub-ttl">Состав инвойса</div>'
    +'<table><thead><tr><th>Наименование</th><th>Артикул</th><th class="tr">Кол-во</th><th class="tr">Цена/ед.</th><th class="tr">Итого</th></tr></thead><tbody>'+rows+'</tbody>'
    +'<tfoot><tr class="tft"><td colspan="4">ИТОГО</td><td class="tr mn">'+M(total)+'</td></tr></tfoot></table>';
}

// ─── INIT ────────────────────────────────────────────────────────────────────
goHome();
</script>
</body>
</html>
